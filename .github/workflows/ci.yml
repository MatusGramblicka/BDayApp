name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SERVER_SOLUTION: BDayServer/BDayServer.sln
  CLIENT_SOLUTION: BDayClient/BDayClient.sln

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build server
        run: dotnet build ${{ env.SERVER_SOLUTION }} --configuration Release

      - name: Build client
        run: dotnet build ${{ env.CLIENT_SOLUTION }} --configuration Release

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests
        run: >
          dotnet test BDayServer/tests/BDayServer.UnitTests/BDayServer.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest   # GitHub-hosted Ubuntu runners ship with Docker, required by Testcontainers
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pre-pull database images
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest &
          docker pull postgres:16-alpine &
          wait

      - name: Run integration tests
        run: >
          dotnet test BDayServer/tests/BDayServer.IntegrationTests/BDayServer.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults
