name: CI

# Pull requests and master only: a push to a branch with an open pull request would otherwise run everything twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "11.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SERVER_SOLUTION: BDayServer/BDayServer.sln
  CLIENT_SOLUTION: BDayClient/BDayClient.sln

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build server
        run: dotnet build ${{ env.SERVER_SOLUTION }} --configuration Release

      - name: Build client
        run: dotnet build ${{ env.CLIENT_SOLUTION }} --configuration Release

      # The same publish Visual Studio runs before Web Deploy. It fails if the generated web.config
      # contains IIS rewrite rules (see BlockRewriteRulesInPublishedWebConfig in BDayServer.csproj).
      - name: Publish server (includes the Blazor client)
        run: dotnet publish BDayServer/BDayServer/BDayServer.csproj --configuration Release --output publish

      - name: Check the Blazor client is in the publish output
        run: |
          for f in publish/wwwroot/index.html publish/wwwroot/_framework/blazor.webassembly.js; do
            test -f "$f" || { echo "::error::$f is missing from the server publish output"; exit 1; }
          done

      # Server-only files must never be deployed from the repository (see MsDeploySkipRules in BDayServer.csproj).
      - name: Check no secrets or local settings are in the publish output
        run: |
          if ls publish/appsettings.Production.json publish/nlog.config 2>/dev/null; then
            echo "::error::server-only settings files ended up in the publish output"; exit 1
          fi

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run unit tests
        run: >
          dotnet test BDayServer/tests/BDayServer.UnitTests/BDayServer.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults

  client-unit-tests:
    name: Client unit tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run client unit tests
        run: >
          dotnet test BDayClient/tests/BDayClient.UnitTests/BDayClient.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=client-unit-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-unit-test-results
          path: TestResults

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest   # GitHub-hosted Ubuntu runners ship with Docker, required by Testcontainers
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pre-pull database images
        run: |
          docker pull mcr.microsoft.com/mssql/server:2022-latest &
          docker pull postgres:16-alpine &
          wait

      - name: Run integration tests
        run: >
          dotnet test BDayServer/tests/BDayServer.IntegrationTests/BDayServer.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults
